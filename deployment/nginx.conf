# Complete nginx.conf, copied to /app/nginx.conf in the observer image.
# A supervised non-root gateway and backend run in the same container, so
# either component's failure restarts their shared network namespace together.
# The host only publishes 8080 on loopback. Backend HTTP comes from 127.0.0.1,
# preserving the application's existing explicit local-HTTP authentication.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log /dev/stdout;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65s;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream observer_backend {
        server 127.0.0.1:8888;
    }

    server {
        listen 8080;
        server_name _;
        # Uploads use application chunk validation; the gateway does not add
        # an independent file-size cap or buffer whole uploads on its disk.
        client_max_body_size 0;
        client_body_timeout 300s;
        send_timeout 300s;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;

        location = /healthz {
            proxy_pass http://observer_backend/readyz;
        }

        # Keep /dbprog, authenticated download URLs, SSE, WebSocket, coverage
        # and sensor-library paths intact. Observer owns all authentication
        # and translates warehouse API and signed object-storage requests.
        location / {
            proxy_pass http://observer_backend;
        }
    }
}

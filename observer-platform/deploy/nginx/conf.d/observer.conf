# Initial HTTP-only acceptance. No credentials or robot data are served on port 80.
server {
    listen 80 default_server;
    server_name _;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location = /healthz { proxy_pass http://backend:8888/healthz; }
    location = /readyz { proxy_pass http://backend:8888/readyz; }
    location = / {
        default_type "text/html; charset=utf-8";
        return 200 '<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Robot Cloud Observer</title><body><h1>云端 Observer 服务入口</h1><p>HTTP 入口已就绪。配置域名与 HTTPS 证书后，使用 HTTPS 登录查看机器人数据。</p><p>此页面不表示机器人在线。</p></body></html>';
    }
    location / { return 403; }
}

# Dedicated robot identity: a local API forward, no shell or reverse listener.
Match User robot-warehouse-upload
    AuthorizedKeysFile /etc/ssh/authorized_keys/robot-warehouse-upload
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PermitTTY no
    X11Forwarding no
    AllowAgentForwarding no
    AllowTcpForwarding local
    PermitOpen 127.0.0.1:13000
    PermitListen none
    AllowStreamLocalForwarding no
    GatewayPorts no
    PermitTunnel no
    PermitUserRC no
    ForceCommand /usr/bin/false
Match all

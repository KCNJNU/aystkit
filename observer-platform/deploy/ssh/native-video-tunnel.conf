# Dedicated forward-only account. No shell, TCP forwarding or robot control.
Match User robot-video-tunnel
    AuthorizedKeysFile /etc/ssh/authorized_keys/robot-video-tunnel
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PermitTTY no
    X11Forwarding no
    AllowAgentForwarding no
    # OpenSSH's shared remote-listener permissions gate Unix forwarding too.
    # Restrict TCP to an unused privileged loopback port; sshd rejects binding
    # this port for this non-root account. Unix sockets stay filesystem-scoped.
    AllowTcpForwarding remote
    PermitListen 127.0.0.1:1
    AllowStreamLocalForwarding remote
    StreamLocalBindMask 0111
    StreamLocalBindUnlink yes
    PermitUserRC no
    ForceCommand /usr/bin/false
Match all

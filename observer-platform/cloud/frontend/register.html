<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b1320">
  <title>注册账号 · 观测平台</title>
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/cloud.css">
  <link rel="stylesheet" href="/access.css">
</head>
<body class="login-page access-page" data-access-page="register">
  <main class="access-main">
    <section class="login-panel access-card" aria-labelledby="register-title">
      <a class="access-brand" href="/login">工控机 <span>观测平台</span></a>
      <h1 id="register-title">注册账号</h1>
      <p class="access-subtitle">需管理员审批</p>
      <form id="register-form" class="access-form" action="/api/register" method="post">
        <label for="username">账号</label>
        <input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="设置账号" required minlength="3" maxlength="32" pattern="[a-zA-Z0-9_.\-]{3,32}" aria-describedby="username-hint">
        <p id="username-hint" class="field-hint">3–32 位字母、数字、下划线、点或短横线</p>
        <label for="password">密码</label>
        <input id="password" name="password" type="password" autocomplete="new-password" placeholder="请输入密码" required>
        <label for="password-confirm">确认密码</label>
        <input id="password-confirm" name="passwordConfirm" type="password" autocomplete="new-password" placeholder="再次输入密码" required>
        <button id="register-submit" class="access-button primary" type="submit">注册账号</button>
        <p id="access-message" class="access-message" role="status" aria-live="polite"></p>
      </form>
      <p class="account-switch"><a href="/login">返回登录</a></p>
    </section>
  </main>
  <script src="/access.js"></script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b1320">
  <title>修改密码 · 观测平台</title>
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/cloud.css">
  <link rel="stylesheet" href="/access.css">
</head>
<body class="login-page access-page" data-access-page="password">
  <main class="access-main">
    <section class="login-panel access-card" aria-labelledby="password-title">
      <a class="access-back" href="/">← 返回观测</a>
      <h1 id="password-title">修改密码</h1>
      <p id="access-username" class="pending-username"></p>
      <form id="password-form" class="access-form">
        <label for="current-password">当前密码</label>
        <input id="current-password" type="password" autocomplete="current-password" required>
        <label for="new-password">新密码</label>
        <input id="new-password" type="password" autocomplete="new-password" required>
        <label for="new-password-confirm">确认新密码</label>
        <input id="new-password-confirm" type="password" autocomplete="new-password" required>
        <button id="password-submit" class="access-button primary" type="submit">保存密码</button>
      </form>
      <p id="access-message" class="access-message" role="status" aria-live="polite"></p>
      <a id="password-login" class="access-button secondary" href="/login" hidden>重新登录</a>
    </section>
  </main>
  <script src="/access.js"></script>
</body>
</html>

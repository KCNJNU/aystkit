# Standalone installation. Only the gateway's loopback port is published.
x-warehouse-environment: &warehouse-environment
  NODE_ENV: production
  API_PORT: "3000"
  DATABASE_URL: ${DATABASE_URL:?Run python3 run-platform.py start first}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  OBJECT_STORAGE_ENDPOINT: minio
  OBJECT_STORAGE_PORT: "9000"
  OBJECT_STORAGE_USE_SSL: "false"
  OBJECT_STORAGE_PUBLIC_ENDPOINT: warehouse-minio
  OBJECT_STORAGE_PUBLIC_PORT: "9000"
  OBJECT_STORAGE_BUCKET: robot-raw-files
  OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:?}
  OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?}
  DVC_COMMAND: /opt/dvc/bin/dvc
  DVC_REPOSITORY_ROOT: /app/data/dataset-repository
  DVC_REMOTE_NAME: robot-dvc
  DVC_REMOTE_ENDPOINT: minio
  DVC_REMOTE_PORT: "9000"
  DVC_REMOTE_USE_SSL: "false"
  DVC_REMOTE_BUCKET: robot-dvc-store
  DVC_REMOTE_ACCESS_KEY: ${MINIO_ROOT_USER:?}
  DVC_REMOTE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?}
  DATASET_PUBLISH_GIT_AUTHOR_NAME: Dataset Publisher
  DATASET_PUBLISH_GIT_AUTHOR_EMAIL: dataset-publisher@example.invalid
  BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?}
  AUTH_SESSION_HOURS: "12"
  AUTH_COOKIE_SECURE: "false"
  RATE_LIMIT_KEY_SALT: ${RATE_LIMIT_KEY_SALT:?}
  CORS_ORIGIN: ${PUBLIC_ORIGIN:?}
  DEPLOYMENT_ENVIRONMENT: STANDALONE
  WORKER_CONCURRENCY: "2"
  RETENTION_EXECUTION_ENABLED: "false"
  GARAGE_ARCHIVE_CONTROL_DIR: ""
  QWEN_API_KEY: ${QWEN_API_KEY:-}
  QWEN_BASE_URL: https://dashscope.aliyuncs.com/compatible-mode/v1
  QWEN_MODEL: qwen-plus
  QWEN_TIMEOUT: "30000"
  QWEN_MAX_TOKENS: "2048"

x-warehouse-build: &warehouse-build
  context: ./warehouse-platform
  dockerfile: apps/api/Dockerfile

x-service: &service
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

services:
  postgres:
    <<: *service
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_DB: robot_platform
      POSTGRES_USER: robot_platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    <<: *service
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    command: [redis-server, --appendonly, "yes"]
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 30

  minio:
    <<: *service
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: [server, /data, --console-address, ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    volumes: [minio_data:/data]
    networks:
      default: {aliases: [warehouse-minio]}
    healthcheck:
      test: [CMD, mc, ready, local]
      interval: 5s
      timeout: 5s
      retries: 30

  storage-init:
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        mc alias set warehouse http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null
        mc mb --ignore-existing warehouse/robot-raw-files warehouse/robot-dvc-store

  migration:
    image: ${PLATFORM_IMAGE_PREFIX:-aystkit}-migration:standalone
    build:
      <<: *warehouse-build
      target: migration
    environment:
      DATABASE_URL: ${DATABASE_URL:?}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?}
      BOOTSTRAP_ROBOT_ID: ${BOOTSTRAP_ROBOT_ID:-}
      BOOTSTRAP_ROBOT_EXTERNAL_ID: ${BOOTSTRAP_ROBOT_EXTERNAL_ID:-}
    depends_on:
      postgres: {condition: service_healthy}
    volumes: [./deployment/bootstrap-warehouse.cjs:/deployment/bootstrap-warehouse.cjs:ro]
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        ./node_modules/.bin/prisma migrate deploy --schema apps/api/prisma/schema.prisma
        node /deployment/bootstrap-warehouse.cjs

  workspace-init:
    image: ${PLATFORM_IMAGE_PREFIX:-aystkit}-api:standalone
    volumes: [dataset_data:/app/data]
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        mkdir -p /app/data/dataset-repository
        test -d /app/data/dataset-repository/.git || git -C /app/data/dataset-repository init --quiet

  warehouse-api:
    <<: *service
    image: ${PLATFORM_IMAGE_PREFIX:-aystkit}-api:standalone
    build:
      <<: *warehouse-build
      target: runtime
    init: true
    environment: *warehouse-environment
    volumes: [dataset_data:/app/data]
    depends_on:
      migration: {condition: service_completed_successfully}
      workspace-init: {condition: service_completed_successfully}
      storage-init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://127.0.0.1:3000/ready").then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))']
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 30

  worker:
    <<: *service
    image: ${PLATFORM_IMAGE_PREFIX:-aystkit}-worker:standalone
    build:
      <<: *warehouse-build
      target: worker
    init: true
    environment: *warehouse-environment
    volumes: [dataset_data:/app/data]
    depends_on:
      warehouse-api: {condition: service_healthy}

  observer:
    <<: *service
    image: ${PLATFORM_IMAGE_PREFIX:-aystkit}-observer:standalone
    build:
      context: .
      dockerfile: deployment/Dockerfile.observer
      target: ${OBSERVER_BUILD_TARGET:-deployed-frontend}
    init: true
    environment:
      ROBOT_ID: ${ROBOT_ID:?}
      ROBOT_FLEET_JSON: ${ROBOT_FLEET_JSON:?}
      DEVICE_CREDENTIALS_JSON: ${DEVICE_CREDENTIALS_JSON:?}
      VIEWER_USERNAME: ${VIEWER_USERNAME:?}
      VIEWER_PASSWORD_HASH: ${VIEWER_PASSWORD_HASH:?}
      SESSION_SECRET: ${SESSION_SECRET:?}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?}
      ALLOW_INSECURE_LOCAL: "true"
      TRUSTED_PROXY_CIDRS: 127.0.0.1/32,::1/128
      DATA_DIR: /data
      PORT: "8888"
      HOST: 0.0.0.0
      DBPROG_API_URL: http://warehouse-api:3000
      DBPROG_OBJECT_URLS: http://warehouse-minio:9000
    # nginx and observer run together; authenticated HTTP stays on loopback.
    ports: ["127.0.0.1:${PLATFORM_PORT:-8080}:8080"]
    volumes: [observer_data:/data]
    read_only: true
    tmpfs: [/tmp:size=32m]
    cap_drop: [ALL]
    depends_on:
      warehouse-api: {condition: service_healthy}

volumes:
  postgres_data:
  redis_data:
  minio_data:
  dataset_data:
  observer_data:
